# Bench broker: plain MQTT 3.1.1 on 1883, no TLS (out of scope for now).
# The password file is generated by entrypoint.sh into the writable data
# volume so hashed credentials never reach git.
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/data/mosquitto.passwd
acl_file /mosquitto/config/acl.conf