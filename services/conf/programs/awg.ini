; Optional AmneziaWG server. The userspace tools are not packaged in Debian
; trixie: build amneziawg-tools into the image and load the amneziawg kernel
; module on the host (DKMS) before enabling this program. For the DUT the
; module is built from sysdrv/drv_ko/amneziawg instead.
; Drop conf/wireguard/awg0.conf (same directory as wg profiles), set
; autostart=true and restart the container.
[program:awg]
command=/usr/bin/awg-quick up /etc/oko-services/wireguard/awg0.conf
autostart=false
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true