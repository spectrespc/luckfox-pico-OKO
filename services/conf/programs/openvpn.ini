; Optional OpenVPN server. Inactive by default: drop
; conf/openvpn/server.conf (and keys/certs next to it), set autostart=true
; (or run `docker exec oko-services supervisorctl start openvpn`) and restart
; the container. Keep private keys out of git: conf/openvpn is tracked, so put
; real keys under output/srv/vpn/ and reference them from server.conf.
[program:openvpn]
command=/usr/sbin/openvpn --config /etc/oko-services/openvpn/server.conf
autostart=false
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true