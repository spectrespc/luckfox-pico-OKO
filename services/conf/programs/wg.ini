; Optional WireGuard server. Inactive by default: drop a profile at
; conf/wireguard/wg0.conf, set autostart=true (or run
; `docker exec oko-services supervisorctl start wg`) and restart the container.
; wg-quick configures the interface and exits, so the program stays in the
; EXITED state; stop it with `docker exec oko-services wg-quick down wg0`.
[program:wg]
command=/usr/bin/wg-quick up /etc/oko-services/wireguard/wg0.conf
autostart=false
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true