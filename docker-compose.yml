services:
  luckfox-builder:
    build:
      context: .
      args:
        UID: ${CURRENT_UID:-1000}
        GID: ${CURRENT_GID:-1000}
    image: luckfox-builder:22.04
    container_name: luckfox_oko_build_env
    volumes:
      - .:/workspace
    working_dir: /workspace
    tty: true
    stdin_open: true
    # Сетевой стек хоста нужен для доступа к внешним ресурсам при сборке
    network_mode: host
