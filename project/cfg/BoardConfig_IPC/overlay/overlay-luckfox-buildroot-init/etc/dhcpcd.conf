# OKO: identify the board by its stable Ethernet MAC, not by a DUID stored in
# /var/db/dhcpcd.  The DUID is recreated by a full firmware update, which made
# the DHCP server hand out a new address after every flash.
clientid
persistent
option domain_name_servers, domain_name, domain_search
option classless_static_routes
option interface_mtu

# OKO: /etc/resolv.conf has a single writer, /usr/bin/oko-route, which merges
# the Ethernet and Wi-Fi resolvers in metric order.  The lease resolvers are
# saved by /lib/dhcpcd/dhcpcd-hooks/20-oko-route instead.
nohook resolv.conf
