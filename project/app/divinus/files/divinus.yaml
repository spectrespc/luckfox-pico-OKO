# Factory config for OpenIPC/divinus on Luckfox Pico Pro Max (RV1106 + SC230AI).
# Installed to /oem/usr/share/divinus/divinus.yaml and copied to /userdata on
# first start (see RkLunch.sh). WebUI saves land next to the running config.
system:
  web_port: 80
  # Factory credentials for the testbench; change before connecting the camera
  # to an untrusted network (see TESTBENCH.md).
  web_enable_auth: true
  web_auth_user: admin
  web_auth_pass: oko-change-me
  web_auth_skiplocal: false
  web_enable_static: true
  isp_thread_stack_size: 16384
  venc_stream_thread_stack_size: 16384
  web_server_thread_stack_size: 65536
  time_format: "%Y-%m-%d %H:%M:%S"
  # NTP: an empty server keeps the distribution /etc/ntp.conf (the image
  # starts ntpd from /etc/init.d/S49ntp). A server value makes divinus drive
  # ntpd itself from /tmp/divinus-ntp.conf.
  ntp_enable: true
  ntp_server: ""
  # 0 disables the software watchdog: a stopped test process must not reboot the board
  watchdog: 0

isp:
  mirror: false
  flip: false
  antiflicker: 50

osd:
  enable: true
  # main: OSD on the main stream only; all: also on sub and JPEG (needs the
  # multi-attach gate G4 to pass on the target build).
  scope: main
  # OSD regions (simsun_en.ttf is the only font available in /oem/usr/share).
  # reg0: time, bottom-right (1920x1080);
  # reg1: SHT21/STM32/INA3221/LTE+WiFi (or T/BAT fallback), four lines, top-left;
  # reg2: GPS, top-right;
  # reg3: external text from /tmp/osd.fifo, top-left below telemetry.
  # reg4: CPU load, free memory and CPU temperature, three lines, bottom-left.
  # reg5: IVS motion indicator, below the message region (hidden when the
  # /tmp/osd-ivs.txt file is empty or absent).
  # Font size 24 px; text color RGB565 0x07e0 (bright green);
  # black outline 0x8000, 1 px thick, for readability over video.
  reg0_text: "$t"
  reg0_font: simsun_en
  reg0_size: 24.0
  reg0_color: 0x07e0
  reg0_outl: 0x8000
  reg0_thick: 1.0
  reg0_posx: 1648
  reg0_posy: 1024
  reg1_text: "@/tmp/osd-dyn.txt"
  reg1_font: simsun_en
  reg1_size: 24.0
  reg1_color: 0x07e0
  reg1_outl: 0x8000
  reg1_thick: 1.0
  reg1_posx: 16
  reg1_posy: 16
  reg2_text: "@/tmp/osd-gps.txt"
  reg2_font: simsun_en
  reg2_size: 24.0
  reg2_color: 0x07e0
  reg2_outl: 0x8000
  reg2_thick: 1.0
  reg2_posx: 1600
  reg2_posy: 16
  reg3_text: "@/tmp/osd-msg.txt"
  reg3_font: simsun_en
  reg3_size: 24.0
  reg3_color: 0x07e0
  reg3_outl: 0x8000
  reg3_thick: 1.0
  reg3_posx: 16
  reg3_posy: 160
  reg4_text: "@/tmp/osd-sys.txt"
  reg4_font: simsun_en
  reg4_size: 24.0
  reg4_color: 0x07e0
  reg4_outl: 0x8000
  reg4_thick: 1.0
  reg4_posx: 16
  reg4_posy: 960
  reg5_text: "@/tmp/osd-ivs.txt"
  reg5_font: simsun_en
  reg5_size: 24.0
  reg5_color: 0x07e0
  reg5_outl: 0x8000
  reg5_thick: 1.0
  reg5_posx: 16
  reg5_posy: 240

mdns:
  enable: false

onvif:
  enable: false
  enable_auth: true
  auth_user: admin
  auth_pass: oko-change-me

rtsp:
  enable: true
  enable_auth: true
  auth_user: admin
  auth_pass: oko-change-me
  port: 554

record:
  enable: false
  continuous: false
  # main or sub; the recorder only consumes the selected VENC channel
  source: main
  path: /mnt/sdcard/recordings
  # ring quota: delete the oldest .mp4 segments when the card gets full
  max_bytes: 0
  min_free_mb: 2

stream:
  enable: false
  udp_srcport: 5600
  dest:
    - udp://239.255.255.0:5600

night_mode:
  enable: false
  ir_sensor_pin: 62
  check_interval_s: 10
  ir_cut_pin1: 1
  ir_cut_pin2: 2
  ir_led_pin: 3
  pin_switch_delay_us: 150
  adc_device: /dev/sar_adc_drv
  lamp: ir
  adc_threshold: 128

http_post:
  enable: false
  host: none
  url: /
  width: 640
  height: 360
  qfactor: 90
  interval: 60
  login: none
  password: none

audio:
  enable: false
  srate: 48000
  bitrate: 128
  gain: 0

mp4:
  enable: true
  codec: H.265
  mode: CBR
  # SC230AI native mode is 1920x1080 (sc230ai.c supported_modes[0])
  width: 1920
  height: 1080
  fps: 30
  gop: 50
  bitrate: 4096
  profile: 2

jpeg:
  enable: true
  width: 1920
  height: 1080
  qfactor: 80

mjpeg:
  enable: false
  mode: CBR
  width: 1920
  height: 1080
  fps: 30
  bitrate: 1024
  qfactor: 80

