# Factory config for OpenIPC/divinus on Luckfox Pico Pro Max (RV1106 + SC230AI).
# Installed to /oem/usr/share/divinus/divinus.yaml and copied to /userdata on
# first start (see RkLunch.sh). WebUI saves land next to the running config.
system:
  web_port: 80
  # Factory credentials for the testbench; change before connecting the camera
  # to an untrusted network (see TESTBENCH.md).
  web_enable_auth: true
  web_auth_user: admin
  web_auth_pass: oko-change-me
  web_auth_skiplocal: false
  web_enable_static: true
  isp_thread_stack_size: 16384
  venc_stream_thread_stack_size: 16384
  web_server_thread_stack_size: 65536
  time_format: "%Y-%m-%d %H:%M:%S"
  # 0 disables the software watchdog: a stopped test process must not reboot the board
  watchdog: 0

isp:
  mirror: false
  flip: false
  antiflicker: 50

osd:
  enable: false

mdns:
  enable: false

onvif:
  enable: false
  enable_auth: true
  auth_user: admin
  auth_pass: oko-change-me

rtsp:
  enable: true
  enable_auth: true
  auth_user: admin
  auth_pass: oko-change-me
  port: 554

record:
  enable: false
  continuous: false
  path: /mnt/sdcard/recordings

stream:
  enable: false
  udp_srcport: 5600
  dest:
    - udp://239.255.255.0:5600

night_mode:
  enable: false
  ir_sensor_pin: 62
  check_interval_s: 10
  ir_cut_pin1: 1
  ir_cut_pin2: 2
  ir_led_pin: 3
  pin_switch_delay_us: 150
  adc_device: /dev/sar_adc_drv
  lamp: ir
  adc_threshold: 128

http_post:
  enable: false
  host: none
  url: /
  width: 640
  height: 360
  qfactor: 90
  interval: 60
  login: none
  password: none

audio:
  enable: false
  srate: 48000
  bitrate: 128
  gain: 0

mp4:
  enable: true
  codec: H.265
  mode: CBR
  # SC230AI native mode is 1920x1080 (sc230ai.c supported_modes[0])
  width: 1920
  height: 1080
  fps: 25
  gop: 50
  bitrate: 2048
  profile: 2

jpeg:
  enable: true
  width: 1920
  height: 1080
  qfactor: 80

mjpeg:
  enable: false
  mode: CBR
  width: 1920
  height: 1080
  fps: 25
  bitrate: 1024
  qfactor: 80